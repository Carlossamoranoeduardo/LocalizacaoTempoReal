<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rota do Motorista</title>
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 15px;
        }

        #status {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        .rotaItem {
    display: flex;
    position: relative;
    background: white;
    margin-bottom: 0;
    min-height: 180px;
}

.linhaRota {
    width: 70px;
    position: relative;
    flex-shrink: 0;
}

.circuloNumero {
    position: absolute;
    top: 8px;
    left: 20px;
    width: 42px;
    height: 42px;
    border: 1px solid #9aa0a6;
    border-radius: 50%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    color: #333;
    z-index: 2;
}

.linhaVertical {
    position: absolute;
    top: 50px;
    bottom: 0;
    left: 40px;
    width: 1px;
    background: #bfc4c9;
}

.conteudoEntrega {
    flex: 1;
    padding: 8px 15px 25px 0;
    border-bottom: 1px solid #ddd;
}

.cabecalhoEntrega {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
}

.nomeCliente {
    font-size: 21px;
    color: #111;
    font-weight: 400;
    padding-top: 8px;
}

.previsao {
    text-align: right;
    color: #6b7785;
    font-size: 14px;
    line-height: 1.4;
}

.previsao strong {
    display: block;
    font-size: 16px;
    font-weight: 500;
}

.enderecoEntrega {
    color: #718096;
    font-size: 15px;
    line-height: 1.45;
    margin-top: 18px;
    margin-bottom: 18px;
}

.botoesEntrega {
    display: flex;
    gap: 10px;
}

.botaoNavegar {
    flex: 0 0 200px;
    background: #1976d2;
    color: white;
    border: 0;
    border-radius: 7px;
    padding: 13px 18px;
    font-size: 17px;
    font-weight: bold;
}

.botaoFinalizar {
    flex: 0 0 150px;
    background: #2e7d32;
    color: white;
    border: 0;
    border-radius: 7px;
    padding: 13px 10px;
    font-size: 15px;
    font-weight: bold;
}

@media (max-width: 600px) {

    .linhaRota {
        width: 62px;
    }

    .circuloNumero {
        left: 12px;
    }

    .linhaVertical {
        left: 32px;
    }

    .conteudoEntrega {
        padding-right: 10px;
    }

    .nomeCliente {
        font-size: 20px;
    }

    .previsao {
        font-size: 13px;
    }

    .botaoNavegar {
        flex: 1;
    }

    .botaoFinalizar {
        flex: 1;
    }

}

    </style>

</head>

<body>

<div class="container">

    <h1>🚚 ROTA DE ENTREGAS</h1>

    <div id="status">
        CARREGANDO ROTA...
    </div>
<button
    id="botaoVerMapa"
    onclick="mostrarMapaRota()"
    style="
        display:none;
        width:100%;
        margin-bottom:15px;
        padding:10px;
        border:0;
        border-radius:8px;
        background:#1976d2;
        color:white;
        font-size:15px;
        font-weight:bold;
    "
>
    🗺️ VER NO MAPA
</button>

<div
    id="mapaRota"
    style="
        display:none;
        width:100%;
        height:450px;
        margin-bottom:15px;
        border-radius:10px;
        overflow:hidden;
    "
></div>

    <div id="listaEntregas"></div>

</div>


<script>

const parametros =
    new URLSearchParams(
        window.location.search
    );

const rotaId =
    parametros.get("id");
const perfil =
    new URLSearchParams(
        window.location.search
    ).get("perfil");

if (perfil === "alex") {

    document.getElementById(
        "botaoVerMapa"
    ).style.display = "block";

}

let audioContext = null;
let audioBufferCleber = null;
let audioCarregado = false;


/*
 * ======================================================
 * PREPARAR ÁUDIO CLEBER
 * ======================================================
 */

async function prepararAudioCleber() {

    try {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        const resposta =
            await fetch(
                "/audio/cleber.mp3"
            );

        if (!resposta.ok) {

            throw new Error(
                "Não foi possível carregar /audio/cleber.mp3"
            );

        }

        const dados =
            await resposta.arrayBuffer();

        audioBufferCleber =
            await audioContext.decodeAudioData(
                dados
            );

        audioCarregado = true;

        console.log(
            "ÁUDIO CLEBER CARREGADO."
        );

    } catch (erro) {

        console.error(
            "ERRO AO CARREGAR ÁUDIO CLEBER:",
            erro
        );

    }

}


/*
 * ======================================================
 * LIBERAR ÁUDIO NO CLIQUE
 * ======================================================
 */

async function liberarAudioCleber() {

    if (!audioContext) {

        return;

    }

    try {

        if (
            audioContext.state ===
            "suspended"
        ) {

            await audioContext.resume();

        }

        console.log(
            "ÁUDIO CLEBER LIBERADO:",
            audioContext.state
        );

    } catch (erro) {

        console.error(
            "ERRO AO LIBERAR ÁUDIO:",
            erro
        );

    }

}


/*
 * ======================================================
 * TOCAR CLEBER
 * ======================================================
 */

function tocarAudioCleber() {

    if (
        !audioContext ||
        !audioBufferCleber ||
        !audioCarregado
    ) {
        console.error("ÁUDIO CLEBER NÃO ESTÁ CARREGADO.");
        return;
    }

    try {

        const fonte =
            audioContext.createBufferSource();

        fonte.buffer =
            audioBufferCleber;

        fonte.connect(
            audioContext.destination
        );

        fonte.onended = function () {

            console.log(
                "ÁUDIO CLEBER TERMINOU."
            );

            console.log(
                "ABRINDO VÍDEO..."
            );

            window.location.href =
                "/video/cleber.mp4";
        };

        fonte.start(0);

        console.log(
            "ÁUDIO CLEBER TOCANDO."
        );

    } catch (erro) {

        console.error(
            "ERRO AO TOCAR ÁUDIO CLEBER:",
            erro
        );

    }

}


let dadosRota = null;


// ======================================================
// ESCAPAR TEXTO
// ======================================================

function escaparTexto(texto) {

    if (
        texto === null ||
        texto === undefined
    ) {
        return "";
    }

    return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ======================================================
// PEGAR DESTINOS
// ======================================================

function obterDestinos() {

    if (
        dadosRota &&
        Array.isArray(dadosRota.destinos)
    ) {

        return dadosRota.destinos;

    }

    if (
        dadosRota &&
        dadosRota.rota &&
        Array.isArray(dadosRota.rota.destinos)
    ) {

        return dadosRota.rota.destinos;

    }

    if (
        dadosRota &&
        Array.isArray(dadosRota.entregas)
    ) {

        return dadosRota.entregas;

    }

    return [];

}


// ======================================================
// PEGAR FINALIZADOS
// ======================================================

function obterFinalizados() {

    if (
        dadosRota &&
        Array.isArray(dadosRota.finalizados)
    ) {

        return dadosRota.finalizados;

    }

    if (
        dadosRota &&
        Array.isArray(dadosRota.finalizadas)
    ) {

        return dadosRota.finalizadas;

    }

    return [];

}


// ======================================================
// ID DA ENTREGA
// ======================================================

function obterIdEntrega(
    entrega,
    indice
) {

    if (
        entrega.id !== undefined &&
        entrega.id !== null
    ) {

        return entrega.id;

    }

    if (
        entrega.entregaId !== undefined &&
        entrega.entregaId !== null
    ) {

        return entrega.entregaId;

    }

    return indice + 1;

}


// ======================================================
// ENDEREÇO
// ======================================================

function obterEndereco(entrega) {

    return (
        entrega.endereco ||
        entrega.address ||
        entrega.nome ||
        "Endereço não informado"
    );

}


// ======================================================
// LATITUDE
// ======================================================

function obterLatitude(entrega) {

    return Number(
        entrega.latitude ??
        entrega.lat ??
        0
    );

}


// ======================================================
// LONGITUDE
// ======================================================

function obterLongitude(entrega) {

    return Number(
        entrega.longitude ??
        entrega.lon ??
        entrega.lng ??
        0
    );

}


// ======================================================
// HORA DE CHEGADA
// ======================================================

function calcularChegada(
    indice
) {

    const agora =
        new Date();

    let segundos = 0;

    const etapas =
        dadosRota &&
        Array.isArray(
            dadosRota.etapas
        )
            ? dadosRota.etapas
            : [];

    for (
        let i = 0;
        i <= indice &&
        i < etapas.length;
        i++
    ) {

        if (
            etapas[i] &&
            Number.isFinite(
                Number(
                    etapas[i].duration
                )
            )
        ) {

            segundos +=
                Number(
                    etapas[i].duration
                );

        }

    }

    const chegada =
        new Date(
            agora.getTime() +
            segundos * 1000
        );

    return chegada.toLocaleTimeString(
        "pt-BR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


// ======================================================
// NAVEGAR
// ======================================================

function navegar(
    latitude,
    longitude
) {

    if (
        !latitude ||
        !longitude
    ) {

        alert(
            "Coordenadas desta entrega não estão disponíveis."
        );

        return;

    }

    const url =
        "https://www.google.com/maps/dir/?api=1" +
        "&destination=" +
        encodeURIComponent(
            latitude + "," + longitude
        ) +
        "&travelmode=driving";

    window.open(
        url,
        "_blank"
    );

}


// ======================================================
// FINALIZAR ENTREGA
// ======================================================

async function finalizarEntrega(entregaId) {

    const destinos = obterDestinos();
    const finalizados = obterFinalizados();

    const pendentes = destinos.filter(
        (entrega, indice) => {

            const id = obterIdEntrega(
                entrega,
                indice
            );

            return (
                entrega.finalizada !== true &&
                entrega.finalizada !== "true" &&
                !finalizados.includes(id) &&
                !finalizados.includes(String(id))
            );
        }
    );

    const ultimaEntrega =
        pendentes.length === 1;


    // LIBERA O ÁUDIO NO CLIQUE DO BOTÃO
    let promessaAudio = null;

    if (perfil === "alex" && audioContext) {

        promessaAudio =
            audioContext.resume();

    }


    // CONFIRMAÇÃO
    if (
        !confirm(
            "Deseja finalizar esta entrega?"
        )
    ) {
        return;
    }


    try {

        const resposta =
            await fetch(
                "/rota-compartilhada/" +
                encodeURIComponent(rotaId) +
                "/finalizar/" +
                encodeURIComponent(entregaId),
                {
                    method: "POST"
                }
            );

        const resultado =
            await resposta.json();


        if (!resposta.ok) {

            throw new Error(
                resultado.erro ||
                "Não foi possível finalizar a entrega."
            );

        }


        // ÚLTIMA ENTREGA DO ALEX
        if (
            perfil === "alex" &&
            ultimaEntrega
        ) {

            console.log(
                "ALEX: ÚLTIMA ENTREGA FINALIZADA."
            );

            if (promessaAudio) {

                await promessaAudio;

            }

            if (
                audioContext.state !==
                "running"
            ) {

                await audioContext.resume();

            }

            tocarAudioCleber();

        }


        await carregarRota();


    } catch (erro) {

        console.error(
            "ERRO AO FINALIZAR:",
            erro
        );

        alert(
            erro.message
        );

    }

}

// ======================================================
// MOSTRAR ROTA
// ======================================================

function mostrarRota() {

    const lista =
        document.getElementById("listaEntregas");

    const status =
        document.getElementById("status");

    lista.innerHTML = "";

    const destinos =
        obterDestinos();

    const finalizados =
        obterFinalizados();

    const pendentes =
        destinos.filter(
            entrega => {

                const id =
                    obterIdEntrega(
                        entrega,
                        0
                    );

                return (
                    entrega.finalizada !== true &&
                    entrega.finalizada !== "true" &&
                    !finalizados.includes(id) &&
                    !finalizados.includes(String(id))
                );

            }
        );

    if (pendentes.length === 0) {

        status.textContent =
            "✓ ROTA FINALIZADA";

        lista.innerHTML = `
            <div class="finalizada">
                ✓ TODAS AS ENTREGAS FORAM FINALIZADAS
            </div>
        `;

        return;
    }

    status.textContent =
        pendentes.length +
        " ENTREGA(S) PENDENTE(S)";


    pendentes.forEach(
        (entrega, indice) => {

            const id =
                obterIdEntrega(
                    entrega,
                    indice
                );

            const numero =
                entrega.numero ??
                entrega.id ??
                indice + 1;

            const latitude =
                obterLatitude(
                    entrega
                );

            const longitude =
                obterLongitude(
                    entrega
                );

            const endereco =
                obterEndereco(
                    entrega
                );

            const nome =
                entrega.nome ||
                entrega.cliente ||
                entrega.nomeCliente ||
                "Entrega " + numero;

            let chegada =
                entrega.previsaoChegada ||
                entrega.previsao_chegada ||
                "";

            if (chegada) {

                try {

                    const data =
                        new Date(chegada);

                    if (!isNaN(data.getTime())) {

                        chegada =
                            data.toLocaleTimeString(
                                "pt-BR",
                                {
                                    hour: "2-digit",
                                    minute: "2-digit"
                                }
                            );

                    }

                } catch (erro) {}

            }

            if (!chegada) {

                chegada =
                    calcularChegada(
                        destinos.indexOf(
                            entrega
                        )
                    );

            }


            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "rotaItem";


            div.innerHTML = `

                <div class="linhaRota">

                    <div class="circuloNumero">
                        ${numero}
                    </div>

                    <div class="linhaVertical"></div>

                </div>


                <div class="conteudoEntrega">

                    <div class="cabecalhoEntrega">

                        <div class="nomeCliente">
                            ${escaparTexto(nome)}
                        </div>

                        <div class="previsao">
                            Previsão de<br>
                            chegada
                            <strong>
                                ${escaparTexto(
                                    chegada
                                )}
                            </strong>
                        </div>

                    </div>


                    <div class="enderecoEntrega">
                        ${escaparTexto(endereco)}
                    </div>


                    <div class="botoesEntrega">

                        <button
                            class="botaoNavegar"
                            onclick="navegar(
                                ${latitude},
                                ${longitude}
                            )"
                        >
                            ↪ &nbsp; Navegar
                        </button>


                        <button
                            class="botaoFinalizar"
                            onclick="finalizarEntrega(
                                '${String(id).replace(
                                    /'/g,
                                    "\\'"
                                )}'
                            )"
                        >
                            FINALIZAR
                        </button>

                    </div>

                </div>

            `;


            lista.appendChild(
                div
            );

        }
    );

}


// ======================================================
// CARREGAR ROTA
// ======================================================

async function carregarRota() {

    if (!rotaId) {

        document.getElementById(
            "status"
        ).textContent =
            "LINK DE ROTA INVÁLIDO";

        return;

    }


    try {

        document.getElementById(
            "status"
        ).textContent =
            "CARREGANDO ROTA...";


        const resposta =
            await fetch(
                "/rota-compartilhada/" +
                encodeURIComponent(
                    rotaId
                )
            );


        const resultado =
            await resposta.json();


        if (
            !resposta.ok
        ) {

            throw new Error(
                resultado.erro ||
                "Não foi possível carregar a rota."
            );

        }


        dadosRota =
            resultado;


        mostrarRota();


    } catch (erro) {

        console.error(
            erro
        );


        document.getElementById(
            "status"
        ).innerHTML =
            `
            <div class="erro">
                ${escaparTexto(
                    erro.message
                )}
            </div>
            `;

    }

}


// ======================================================
// INICIAR
// ======================================================

</script>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<script>

let mapaRota = null;
let camadaRota = null;

async function mostrarMapaRota() {

    const botao =
        document.getElementById("botaoVerMapa");

    const divMapa =
        document.getElementById("mapaRota");

    if (!dadosRota) {

        alert("A rota ainda não foi carregada.");

        return;
    }

    divMapa.style.display = "block";

    botao.textContent = "🗺️ MAPA DA ROTA";

    if (mapaRota) {

        setTimeout(() => {
            mapaRota.invalidateSize();
        }, 100);

        return;
    }

    mapaRota =
        L.map("mapaRota")
        .setView(
            [-20.81, -49.37],
            10
        );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                "&copy; OpenStreetMap"
        }
    ).addTo(mapaRota);


    const origem =
        dadosRota.origem ||
        dadosRota.rota?.origem;

    const destinos =
        obterDestinos();


    const pontos = [];


    if (
        origem &&
        Number.isFinite(Number(origem.latitude)) &&
        Number.isFinite(Number(origem.longitude))
    ) {

        pontos.push({
            latitude:
                Number(origem.latitude),

            longitude:
                Number(origem.longitude),

            numero: 0
        });

    }


    destinos.forEach(
        (destino, indice) => {

            const latitude =
                obterLatitude(destino);

            const longitude =
                obterLongitude(destino);

            if (
                Number.isFinite(latitude) &&
                Number.isFinite(longitude)
            ) {

                pontos.push({

                    latitude:
                        latitude,

                    longitude:
                        longitude,

                    numero:
                        destino.numero ??
                        indice + 1

                });

            }

        }
    );


    if (pontos.length < 2) {

        alert(
            "Não existem pontos suficientes para desenhar a rota."
        );

        return;
    }


    const coordenadas =
        pontos
        .map(
            ponto =>
                ponto.longitude +
                "," +
                ponto.latitude
        )
        .join(";");


    try {

        const resposta =
            await fetch(
                "https://router.project-osrm.org/route/v1/driving/" +
                coordenadas +
                "?overview=full&geometries=geojson&steps=false"
            );


        const dados =
            await resposta.json();


        if (
            !resposta.ok ||
            dados.code !== "Ok" ||
            !dados.routes ||
            !dados.routes.length
        ) {

            throw new Error(
                "Não foi possível desenhar o percurso."
            );

        }


        const geometria =
            dados.routes[0].geometry;


        camadaRota =
            L.geoJSON(
                geometria
            ).addTo(mapaRota);


        pontos.forEach(
            ponto => {

                const marcador =
                    L.marker([
                        ponto.latitude,
                        ponto.longitude
                    ])
                    .addTo(mapaRota);


                if (ponto.numero === 0) {

                    marcador.bindPopup(
                        "<b>ORIGEM</b>"
                    );

                } else {

                    marcador.bindPopup(
                        "<b>Entrega " +
                        ponto.numero +
                        "</b>"
                    );

                }

            }
        );


        const limites =
            camadaRota.getBounds();


        if (limites.isValid()) {

            mapaRota.fitBounds(
                limites,
                {
                    padding: [20, 20]
                }
            );

        }


    } catch (erro) {

        console.error(
            "ERRO AO MOSTRAR MAPA:",
            erro
        );

        alert(
            "Não foi possível mostrar o percurso."
        );

    }

}


prepararAudioCleber();

carregarRota();

</script>

</body>

</html>
