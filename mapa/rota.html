<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rota do Motorista</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 15px;
        }

        #status {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        .rotaItem {
    display: flex;
    position: relative;
    background: white;
    margin-bottom: 0;
    min-height: 180px;
}

.linhaRota {
    width: 70px;
    position: relative;
    flex-shrink: 0;
}

.circuloNumero {
    position: absolute;
    top: 8px;
    left: 20px;
    width: 42px;
    height: 42px;
    border: 1px solid #9aa0a6;
    border-radius: 50%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    color: #333;
    z-index: 2;
}

.linhaVertical {
    position: absolute;
    top: 50px;
    bottom: 0;
    left: 40px;
    width: 1px;
    background: #bfc4c9;
}

.conteudoEntrega {
    flex: 1;
    padding: 8px 15px 25px 0;
    border-bottom: 1px solid #ddd;
}

.cabecalhoEntrega {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
}

.nomeCliente {
    font-size: 21px;
    color: #111;
    font-weight: 400;
    padding-top: 8px;
}

.previsao {
    text-align: right;
    color: #6b7785;
    font-size: 14px;
    line-height: 1.4;
}

.previsao strong {
    display: block;
    font-size: 16px;
    font-weight: 500;
}

.enderecoEntrega {
    color: #718096;
    font-size: 15px;
    line-height: 1.45;
    margin-top: 18px;
    margin-bottom: 18px;
}

.botoesEntrega {
    display: flex;
    gap: 10px;
}

.botaoNavegar {
    flex: 0 0 200px;
    background: #1976d2;
    color: white;
    border: 0;
    border-radius: 7px;
    padding: 13px 18px;
    font-size: 17px;
    font-weight: bold;
}

.botaoFinalizar {
    flex: 0 0 150px;
    background: #2e7d32;
    color: white;
    border: 0;
    border-radius: 7px;
    padding: 13px 10px;
    font-size: 15px;
    font-weight: bold;
}

@media (max-width: 600px) {

    .linhaRota {
        width: 62px;
    }

    .circuloNumero {
        left: 12px;
    }

    .linhaVertical {
        left: 32px;
    }

    .conteudoEntrega {
        padding-right: 10px;
    }

    .nomeCliente {
        font-size: 20px;
    }

    .previsao {
        font-size: 13px;
    }

    .botaoNavegar {
        flex: 1;
    }

    .botaoFinalizar {
        flex: 1;
    }

}

    </style>

</head>

<body>

<div class="container">

    <h1>🚚 ROTA DE ENTREGAS</h1>

    <div id="status">
        CARREGANDO ROTA...
    </div>

    <div id="listaEntregas"></div>

</div>


<script>

const parametros =
    new URLSearchParams(
        window.location.search
    );

const rotaId =
    parametros.get("id");
const perfil =
    new URLSearchParams(
        window.location.search
    ).get("perfil");
const audioCleber =
    new Audio("/audio/cleber.mp3");

audioCleber.preload = "auto";

function tocarAudioCleber() {

    audioCleber.currentTime = 0;

    audioCleber.play()
        .catch(erro => {
            console.error(
                "Erro ao tocar áudio CLEBER:",
                erro
            );
        });
}


let dadosRota = null;


// ======================================================
// ESCAPAR TEXTO
// ======================================================

function escaparTexto(texto) {

    if (
        texto === null ||
        texto === undefined
    ) {
        return "";
    }

    return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ======================================================
// PEGAR DESTINOS
// ======================================================

function obterDestinos() {

    if (
        dadosRota &&
        Array.isArray(dadosRota.destinos)
    ) {

        return dadosRota.destinos;

    }

    if (
        dadosRota &&
        dadosRota.rota &&
        Array.isArray(dadosRota.rota.destinos)
    ) {

        return dadosRota.rota.destinos;

    }

    if (
        dadosRota &&
        Array.isArray(dadosRota.entregas)
    ) {

        return dadosRota.entregas;

    }

    return [];

}


// ======================================================
// PEGAR FINALIZADOS
// ======================================================

function obterFinalizados() {

    if (
        dadosRota &&
        Array.isArray(dadosRota.finalizados)
    ) {

        return dadosRota.finalizados;

    }

    if (
        dadosRota &&
        Array.isArray(dadosRota.finalizadas)
    ) {

        return dadosRota.finalizadas;

    }

    return [];

}


// ======================================================
// ID DA ENTREGA
// ======================================================

function obterIdEntrega(
    entrega,
    indice
) {

    if (
        entrega.id !== undefined &&
        entrega.id !== null
    ) {

        return entrega.id;

    }

    if (
        entrega.entregaId !== undefined &&
        entrega.entregaId !== null
    ) {

        return entrega.entregaId;

    }

    return indice + 1;

}


// ======================================================
// ENDEREÇO
// ======================================================

function obterEndereco(entrega) {

    return (
        entrega.endereco ||
        entrega.address ||
        entrega.nome ||
        "Endereço não informado"
    );

}


// ======================================================
// LATITUDE
// ======================================================

function obterLatitude(entrega) {

    return Number(
        entrega.latitude ??
        entrega.lat ??
        0
    );

}


// ======================================================
// LONGITUDE
// ======================================================

function obterLongitude(entrega) {

    return Number(
        entrega.longitude ??
        entrega.lon ??
        entrega.lng ??
        0
    );

}


// ======================================================
// HORA DE CHEGADA
// ======================================================

function calcularChegada(
    indice
) {

    const agora =
        new Date();

    let segundos = 0;

    const etapas =
        dadosRota &&
        Array.isArray(
            dadosRota.etapas
        )
            ? dadosRota.etapas
            : [];

    for (
        let i = 0;
        i <= indice &&
        i < etapas.length;
        i++
    ) {

        if (
            etapas[i] &&
            Number.isFinite(
                Number(
                    etapas[i].duration
                )
            )
        ) {

            segundos +=
                Number(
                    etapas[i].duration
                );

        }

    }

    const chegada =
        new Date(
            agora.getTime() +
            segundos * 1000
        );

    return chegada.toLocaleTimeString(
        "pt-BR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


// ======================================================
// NAVEGAR
// ======================================================

function navegar(
    latitude,
    longitude
) {

    if (
        !latitude ||
        !longitude
    ) {

        alert(
            "Coordenadas desta entrega não estão disponíveis."
        );

        return;

    }

    const url =
        "https://www.google.com/maps/dir/?api=1" +
        "&destination=" +
        encodeURIComponent(
            latitude + "," + longitude
        ) +
        "&travelmode=driving";

    window.open(
        url,
        "_blank"
    );

}


// ======================================================
// FINALIZAR ENTREGA
// ======================================================

async function finalizarEntrega(
    entregaId
) {

    /*
     * ==================================================
     * DESCOBRIR SE É A ÚLTIMA ENTREGA
     * ==================================================
     */

    const destinos =
        obterDestinos();

    const finalizados =
        obterFinalizados();

    const pendentes =
        destinos.filter(
            (entrega, indice) => {

                const id =
                    obterIdEntrega(
                        entrega,
                        indice
                    );

                return (
                    entrega.finalizada !== true &&
                    entrega.finalizada !== "true" &&
                    !finalizados.includes(id) &&
                    !finalizados.includes(String(id))
                );

            }
        );

    const ultimaEntrega =
        pendentes.length === 1;


    /*
     * ==================================================
     * ALEX
     *
     * LIBERA O ÁUDIO NO PRIMEIRO CLIQUE,
     * ANTES DO CONFIRM.
     * ==================================================
     */

    let audioLiberado =
        false;

    if (
        perfil === "alex" &&
        ultimaEntrega
    ) {

        console.log(
            "ALEX: última entrega detectada."
        );

        try {

            audioCleber.pause();

            audioCleber.currentTime = 0;

            /*
             * O navegador permite este play porque
             * ele acontece diretamente no clique.
             *
             * Mudo somente para liberar o áudio.
             */

            audioCleber.muted = true;

            await audioCleber.play();

            audioLiberado = true;

            console.log(
                "ALEX: áudio liberado."
            );

        } catch (erro) {

            console.error(
                "ALEX: não conseguiu liberar áudio:",
                erro
            );

            audioLiberado = false;

        }

    }


    /*
     * ==================================================
     * CONFIRMAÇÃO
     * ==================================================
     */

    if (
        !confirm(
            "Deseja finalizar esta entrega?"
        )
    ) {

        if (
            audioLiberado
        ) {

            audioCleber.pause();

            audioCleber.currentTime = 0;

            audioCleber.muted = false;

        }

        return;

    }


    /*
     * ==================================================
     * FINALIZAR NO SERVIDOR
     * ==================================================
     */

    try {

        const resposta =
            await fetch(
                "/rota-compartilhada/" +
                encodeURIComponent(
                    rotaId
                ) +
                "/finalizar/" +
                encodeURIComponent(
                    entregaId
                ),
                {
                    method: "POST"
                }
            );


        const resultado =
            await resposta.json();


        if (
            !resposta.ok
        ) {

            if (
                audioLiberado
            ) {

                audioCleber.pause();

                audioCleber.currentTime = 0;

                audioCleber.muted = false;

            }

            throw new Error(
                resultado.erro ||
                "Não foi possível finalizar a entrega."
            );

        }


        /*
         * ==================================================
         * ÚLTIMA ENTREGA DO ALEX
         *
         * AGORA O SERVIDOR JÁ CONFIRMOU.
         * ==================================================
         */

        if (
            perfil === "alex" &&
            ultimaEntrega
        ) {

            console.log(
                "ALEX: última entrega finalizada."
            );

            audioCleber.pause();

            audioCleber.currentTime = 0;

            audioCleber.muted = false;

            try {

                await audioCleber.play();

                console.log(
                    "ALEX: ÁUDIO CLEBER TOCANDO."
                );

            } catch (erro) {

                console.error(
                    "ALEX: ERRO FINAL AO TOCAR CLEBER:",
                    erro
                );

            }

        }


        /*
         * ==================================================
         * ATUALIZA A TELA
         * ==================================================
         */

        await carregarRota();


    } catch (erro) {

        console.error(
            erro
        );

        alert(
            erro.message
        );

    }

}

// ======================================================
// MOSTRAR ROTA
// ======================================================

function mostrarRota() {

    const lista =
        document.getElementById("listaEntregas");

    const status =
        document.getElementById("status");

    lista.innerHTML = "";

    const destinos =
        obterDestinos();

    const finalizados =
        obterFinalizados();

    const pendentes =
        destinos.filter(
            entrega => {

                const id =
                    obterIdEntrega(
                        entrega,
                        0
                    );

                return (
                    entrega.finalizada !== true &&
                    entrega.finalizada !== "true" &&
                    !finalizados.includes(id) &&
                    !finalizados.includes(String(id))
                );

            }
        );

    if (pendentes.length === 0) {

        status.textContent =
            "✓ ROTA FINALIZADA";

        lista.innerHTML = `
            <div class="finalizada">
                ✓ TODAS AS ENTREGAS FORAM FINALIZADAS
            </div>
        `;

        return;
    }

    status.textContent =
        pendentes.length +
        " ENTREGA(S) PENDENTE(S)";


    pendentes.forEach(
        (entrega, indice) => {

            const id =
                obterIdEntrega(
                    entrega,
                    indice
                );

            const numero =
                entrega.numero ??
                entrega.id ??
                indice + 1;

            const latitude =
                obterLatitude(
                    entrega
                );

            const longitude =
                obterLongitude(
                    entrega
                );

            const endereco =
                obterEndereco(
                    entrega
                );

            const nome =
                entrega.nome ||
                entrega.cliente ||
                entrega.nomeCliente ||
                "Entrega " + numero;

            let chegada =
                entrega.previsaoChegada ||
                entrega.previsao_chegada ||
                "";

            if (chegada) {

                try {

                    const data =
                        new Date(chegada);

                    if (!isNaN(data.getTime())) {

                        chegada =
                            data.toLocaleTimeString(
                                "pt-BR",
                                {
                                    hour: "2-digit",
                                    minute: "2-digit"
                                }
                            );

                    }

                } catch (erro) {}

            }

            if (!chegada) {

                chegada =
                    calcularChegada(
                        destinos.indexOf(
                            entrega
                        )
                    );

            }


            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "rotaItem";


            div.innerHTML = `

                <div class="linhaRota">

                    <div class="circuloNumero">
                        ${numero}
                    </div>

                    <div class="linhaVertical"></div>

                </div>


                <div class="conteudoEntrega">

                    <div class="cabecalhoEntrega">

                        <div class="nomeCliente">
                            ${escaparTexto(nome)}
                        </div>

                        <div class="previsao">
                            Previsão de<br>
                            chegada
                            <strong>
                                ${escaparTexto(
                                    chegada
                                )}
                            </strong>
                        </div>

                    </div>


                    <div class="enderecoEntrega">
                        ${escaparTexto(endereco)}
                    </div>


                    <div class="botoesEntrega">

                        <button
                            class="botaoNavegar"
                            onclick="navegar(
                                ${latitude},
                                ${longitude}
                            )"
                        >
                            ↪ &nbsp; Navegar
                        </button>


                        <button
                            class="botaoFinalizar"
                            onclick="finalizarEntrega(
                                '${String(id).replace(
                                    /'/g,
                                    "\\'"
                                )}'
                            )"
                        >
                            FINALIZAR
                        </button>

                    </div>

                </div>

            `;


            lista.appendChild(
                div
            );

        }
    );

}


// ======================================================
// CARREGAR ROTA
// ======================================================

async function carregarRota() {

    if (!rotaId) {

        document.getElementById(
            "status"
        ).textContent =
            "LINK DE ROTA INVÁLIDO";

        return;

    }


    try {

        document.getElementById(
            "status"
        ).textContent =
            "CARREGANDO ROTA...";


        const resposta =
            await fetch(
                "/rota-compartilhada/" +
                encodeURIComponent(
                    rotaId
                )
            );


        const resultado =
            await resposta.json();


        if (
            !resposta.ok
        ) {

            throw new Error(
                resultado.erro ||
                "Não foi possível carregar a rota."
            );

        }


        dadosRota =
            resultado;


        mostrarRota();


    } catch (erro) {

        console.error(
            erro
        );


        document.getElementById(
            "status"
        ).innerHTML =
            `
            <div class="erro">
                ${escaparTexto(
                    erro.message
                )}
            </div>
            `;

    }

}


// ======================================================
// INICIAR
// ======================================================

carregarRota();

</script>

</body>

</html>
