<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Localização em Tempo Real</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

#map {
    width: 100%;
    height: 100vh;
}

#painel {
    position: absolute;
    z-index: 1000;
    top: 15px;
    left: 15px;
    width: 360px;
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    padding: 18px;
    border-radius: 12px;
    font-family: Arial, sans-serif;
    box-shadow: 0 3px 15px rgba(0,0,0,.3);
}

textarea {
    width: 100%;
    height: 300px;
    box-sizing: border-box;
    resize: vertical;
    padding: 10px;
    font-size: 14px;
}

button {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    background: #1976d2;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #125ca5;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

#status {
    margin-top: 12px;
    font-weight: bold;
}

#info {
    margin-top: 10px;
    line-height: 1.5;
}

#telaLogin {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f2f2f2;
}

#caixaLogin {
    width: 340px;
    max-width: 90%;
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
    font-family: Arial, sans-serif;
}

#caixaLogin h2 {
    text-align: center;
}

#caixaLogin input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin-top: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

#erroLogin {
    color: #c62828;
    font-weight: bold;
    margin-top: 10px;
    text-align: center;
}

#painelAparelhos {
    margin-top: 15px;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    background: #fafafa;
}

#painelAparelhos h3 {
    margin: 0 0 10px 0;
}

.aparelhoItem {
    padding: 10px;
    margin-bottom: 8px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: white;
}

.aparelhoNome {
    font-weight: bold;
    font-size: 16px;
}

.aparelhoStatus {
    font-size: 13px;
    margin-top: 4px;
}

.aparelhoItem button {
    margin-top: 7px;
    background: #c62828;
    font-size: 12px;
    padding: 8px;
}

.aparelhoItem button:hover {
    background: #8e0000;
}

</style>

</head>

<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="telaLogin">

    <div id="caixaLogin">

        <h2>Roteirizador</h2>

        <input
            id="usuarioLogin"
            type="text"
            placeholder="Usuário"
            autocomplete="username"
        >

        <input
            id="senhaLogin"
            type="password"
            placeholder="Senha"
            autocomplete="current-password"
        >

        <button onclick="entrarSistema()">
            ENTRAR
        </button>

        <div id="erroLogin"></div>

    </div>

</div>


<!-- =====================================================
     PAINEL
===================================================== -->

<div id="painel">

    <h2>Roteirizador</h2>


    <strong>Localização principal:</strong>

    <div id="gps">
        Aguardando GPS...
    </div>


    <br>


    <strong>Endereços</strong>

    <p>
        Cole um endereço por linha.
    </p>


    <textarea
        id="enderecos"
        placeholder="Rua X, 100, São José do Rio Preto - SP
Avenida Y, 500, Campinas - SP
Rua Z, 200, Santos - SP"
    ></textarea>


    <button onclick="calcularRota()">
        CALCULAR ROTA
    </button>


    <button
        id="botaoEnviarRota"
        onclick="enviarRotaParaCelular()"
        style="display:none;background:#2e7d32;"
    >
        ENVIAR ROTA PARA CELULARES

    <button
        id="botaoExportarRelatorio"
        onclick="exportarRelatorio()"
        style="display:none;background:#6a1b9a;"
    >
        EXPORTAR RELATÓRIO
    </button>


    <!-- =================================================
         APARELHOS
    ================================================== -->

    <div id="painelAparelhos">

        <h3>
            APARELHOS CONECTADOS
        </h3>

        <div id="listaAparelhos">
            Nenhum aparelho registrado.
        </div>

    </div>
<!-- =====================================================
     HISTÓRICO DO PERCURSO
====================================================== -->

<div id="painelHistorico" style="
    margin-top:20px;
    padding:15px;
    background:white;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.20);
">

    <h3 style="
        margin-top:0;
        color:#333;
    ">
        HISTÓRICO DO PERCURSO
    </h3>

    <label>
        <strong>CELULAR:</strong>
    </label>

    <select id="historicoAparelho" style="
        width:100%;
        padding:10px;
        margin:8px 0 12px 0;
        border-radius:6px;
        border:1px solid #aaa;
    ">
        <option value="">
            Selecione o celular
        </option>
    </select>

    <label>
        <strong>DATA:</strong>
    </label>

    <input
        type="date"
        id="historicoData"
        style="
            width:100%;
            padding:10px;
            margin:8px 0 12px 0;
            border-radius:6px;
            border:1px solid #aaa;
            box-sizing:border-box;
        "
    >

    <button
        onclick="verHistorico()"
        style="
            width:100%;
            padding:12px;
            border:0;
            border-radius:6px;
            background:#1976d2;
            color:white;
            font-weight:bold;
            cursor:pointer;
        "
    >
        VER PERCURSO
    </button>

    <button
        onclick="limparHistorico()"
        style="
            width:100%;
            padding:12px;
            margin-top:8px;
            border:0;
            border-radius:6px;
            background:#777;
            color:white;
            font-weight:bold;
            cursor:pointer;
        "
    >
        LIMPAR PERCURSO
    </button>

    <div
        id="historicoInfo"
        style="
            margin-top:12px;
            font-weight:bold;
            color:#333;
        "
    ></div>

</div>
 <!-- =================================================
     HISTÓRICO DE PERCURSOS
================================================== -->




    <!-- =================================================
         LINKS
    ================================================== -->

    <div
        id="linksRotas"
        style="display:none;margin-top:15px;"
    >

        <strong>
            LINKS DA ROTA PARA GOOGLE MAPS
        </strong>

        <div id="listaLinksRotas"></div>

    </div>

<div
    id="painelLinkMotorista"
    style="
        display:none;
        margin-top:15px;
        padding:15px;
        border:1px solid #1976d2;
        border-radius:10px;
        background:#f5f9ff;
    "
>

    <strong>
        LINK DA ROTA PARA O MOTORISTA
    </strong>

    <input
        id="campoLinkMotorista"
        type="text"
        readonly
        style="
            width:100%;
            box-sizing:border-box;
            padding:10px;
            margin-top:10px;
        "
    >

    <button
        id="botaoCopiarLinkMotorista"
        onclick="copiarLinkMotorista()"
        style="
            width:100%;
            margin-top:8px;
            padding:12px;
            background:#1976d2;
            color:white;
            border:0;
            border-radius:8px;
            font-weight:bold;
        "
    >
        COPIAR LINK DA ROTA
    </button>

</div>


    <div id="status">
        Aguardando localização...
    </div>


    <div id="info"></div>

</div>


<!-- =====================================================
     MAPA
===================================================== -->

<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="/socket.io/socket.io.js"></script>


<script>

/* ======================================================
   LOGIN
====================================================== */

function entrarSistema() {

    const usuario =
        document
            .getElementById("usuarioLogin")
            .value
            .trim();

    const senha =
        document
            .getElementById("senhaLogin")
            .value;


    if (
        usuario === "carlos eduardo" &&
        senha === "12345"
    ) {

        document
            .getElementById("telaLogin")
            .style.display = "none";

    } else {

        document
            .getElementById("erroLogin")
            .textContent =
                "Usuário ou senha incorretos.";
    }
}


document.addEventListener(
    "keydown",
    function(e) {

        const tela =
            document.getElementById(
                "telaLogin"
            );

        if (
            e.key === "Enter" &&
            tela.style.display !== "none"
        ) {

            entrarSistema();
        }

    }
);


/* ======================================================
   MAPA
====================================================== */

const mapa =
    L.map("map")
     .setView(
        [-22.2, -48.5],
        7
     );


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution:
            "&copy; OpenStreetMap"
    }
).addTo(mapa);


/* ======================================================
   VARIÁVEIS
====================================================== */

let latitudeAtual = null;

let longitudeAtual = null;

let aparelhoPrincipalId = null;

let rotaAtual = null;

let rotaLayer = null;

let marcadores = [];
let historicoLayer = null;




// ======================================================
// HISTÓRICO DE PERCURSO
// ======================================================



/*
 * IMPORTANTE:
 *
 * Cada aparelho possui sua própria entrada aqui.
 *
 * aparelhosMapa[id]
 *
 * Cada entrada possui:
 *
 * - aparelhoId
 * - nome
 * - latitude
 * - longitude
 * - online
 * - marcador
 */

const aparelhosMapa = {};


/* ======================================================
   SOCKET.IO
====================================================== */

const socket = io();


/* ------------------------------------------------------
   CONECTOU
------------------------------------------------------ */

socket.on(
    "connect",
    function() {

        document.getElementById(
            "status"
        ).textContent =
            "Servidor conectado";

    }
);


/* ------------------------------------------------------
   LISTA INICIAL DOS APARELHOS
------------------------------------------------------ */

socket.on(
    "listaAparelhos",
    function(lista) {

        if (
            !Array.isArray(lista)
        ) {

            return;
        }


        lista.forEach(
            function(aparelho) {

                atualizarAparelhoNoMapa(
                    aparelho
                );

            }
        );


        renderizarListaAparelhos();

    }
);


/* ------------------------------------------------------
   NOVA LOCALIZAÇÃO
------------------------------------------------------ */

socket.on(
    "atualizarLocalizacao",
    function(dados) {

        if (!dados) {
            return;
        }


        atualizarAparelhoNoMapa({

            aparelhoId:
                dados.aparelhoId ||
                "principal",

            nome:
                dados.nome ||
                "Celular",

            latitude:
                dados.latitude,

            longitude:
                dados.longitude,

            precisao:
                dados.precisao,

            horario:
                dados.horario,

            online:
                dados.online !== false

        });

    }
);


/* ------------------------------------------------------
   APARELHO ATUALIZADO / OFFLINE
------------------------------------------------------ */

socket.on(
    "aparelhoAtualizado",
    function(aparelho) {

        atualizarAparelhoNoMapa(
            aparelho
        );

        renderizarListaAparelhos();

    }
);


/* ======================================================
   CRIAR CARRINHO
====================================================== */

function criarMarcadorCarro(
    lat,
    lon,
    nome
) {

    const nomeSeguro =
        String(nome)
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");


    const iconeCarro =
        L.divIcon({

            className:
                "marcador-carro",

            html: `
                <div
                    title="${nomeSeguro}"
                    style="
                        width:46px;
                        height:46px;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        background:white;
                        border:3px solid #1976d2;
                        border-radius:50%;
                        box-shadow:0 3px 10px rgba(0,0,0,.45);
                        font-size:29px;
                        line-height:1;
                    "
                >
                    🚗
                </div>
            `,

            iconSize:
                [52, 52],

            iconAnchor:
                [26, 26],

            popupAnchor:
                [0, -28]

        });


    return L
        .marker(
            [lat, lon],
            {
                icon: iconeCarro
            }
        )
        .addTo(mapa);
}


/* ======================================================
   ATUALIZAR APARELHO
====================================================== */

function atualizarAparelhoNoMapa(
    aparelho
) {

    if (!aparelho) {
        return;
    }


    const id =
        String(
            aparelho.aparelhoId ||
            "principal"
        );


    const lat =
        Number(
            aparelho.latitude
        );


    const lon =
        Number(
            aparelho.longitude
        );


    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    ) {

        return;
    }


    const numero =
        Object.keys(
            aparelhosMapa
        ).length + 1;


    const nome =
        aparelho.nome ||
        "Celular " + numero;


    const online =
        aparelho.online !== false;


    /* --------------------------------------------------
       NOVO APARELHO
    -------------------------------------------------- */

    if (
        !aparelhosMapa[id]
    ) {

        const marcador =
            criarMarcadorCarro(
                lat,
                lon,
                nome
            );


        aparelhosMapa[id] = {

            aparelhoId:
                id,

            nome:
                nome,

            latitude:
                lat,

            longitude:
                lon,

            precisao:
                aparelho.precisao,

            horario:
                aparelho.horario,

            online:
                online,

            visivel:
                true,

            marcador:
                marcador

        };

    }


    /* --------------------------------------------------
       APARELHO JÁ EXISTENTE
    -------------------------------------------------- */

    else {

        const item =
            aparelhosMapa[id];


        item.nome =
            nome;

        item.latitude =
            lat;

        item.longitude =
            lon;

        item.precisao =
            aparelho.precisao;

        item.horario =
            aparelho.horario;

        item.online =
            online;


        /*
         * SOMENTE O CARRINHO DESTE ID
         * É MOVIMENTADO.
         */

        item.marcador.setLatLng(
            [
                lat,
                lon
            ]
        );


        if (
            item.visivel
        ) {

            item.marcador.addTo(
                mapa
            );
        }

    }


    const item =
        aparelhosMapa[id];


    /* --------------------------------------------------
       POPUP DO CARRINHO
    -------------------------------------------------- */

    item.marcador.bindPopup(

        "<strong>" +
        nome +
        "</strong><br>" +

        "Latitude: " +
        lat.toFixed(6) +
        "<br>" +

        "Longitude: " +
        lon.toFixed(6) +
        "<br>" +

        (
            online
                ? "🟢 ONLINE"
                : "⚪ OFFLINE — última posição"
        )

    );


    /* --------------------------------------------------
       APARELHO PRINCIPAL
    -------------------------------------------------- */

    if (
        !aparelhoPrincipalId
    ) {

        aparelhoPrincipalId =
            id;
    }


    /*
     * O aparelho principal continua sendo
     * usado como origem da rota.
     */

    if (
        id === aparelhoPrincipalId
    ) {

        latitudeAtual =
            lat;

        longitudeAtual =
            lon;


        document.getElementById(
            "gps"
        ).textContent =

            lat.toFixed(6) +
            ", " +
            lon.toFixed(6);


        document.getElementById(
            "status"
        ).textContent =

            online
                ? "GPS conectado"
                : "GPS offline — última posição";

    }


    renderizarListaAparelhos();

}


/* ======================================================
   LISTA DOS APARELHOS
====================================================== */

function renderizarListaAparelhos() {

    const lista =
        document.getElementById(
            "listaAparelhos"
        );


    const ids =
        Object.keys(
            aparelhosMapa
        );


    if (
        ids.length === 0
    ) {

        lista.innerHTML =
            "Nenhum aparelho registrado.";

        return;
    }


    lista.innerHTML = "";


    ids.forEach(
        function(id) {

            const aparelho =
                aparelhosMapa[id];


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "aparelhoItem";


            const status =
                aparelho.online
                    ? "🟢 ONLINE"
                    : "⚪ OFFLINE — última posição";


            item.innerHTML =

                `<div class="aparelhoNome">
                    🚗 ${aparelho.nome}
                </div>` +

                `<div class="aparelhoStatus">
                    ${status}
                </div>` +

                `<div>
                    Latitude:
                    ${aparelho.latitude.toFixed(6)}
                </div>` +

                `<div>
                    Longitude:
                    ${aparelho.longitude.toFixed(6)}
                </div>`;


            const botao =
                document.createElement(
                    "button"
                );


            botao.textContent =

                aparelho.visivel
                    ? "REMOVER DO MAPA"
                    : "MOSTRAR NO MAPA";


            botao.onclick =
                function() {

                    alternarLocalizacao(
                        id
                    );

                };


            item.appendChild(
                botao
            );


            lista.appendChild(
                item
            );

        }
    );
    atualizarSelectHistorico();

}


/* ======================================================
   MOSTRAR / ESCONDER APARELHO
====================================================== */

function alternarLocalizacao(
    id
) {

    const aparelho =
        aparelhosMapa[id];


    if (!aparelho) {
        return;
    }


    aparelho.visivel =
        !aparelho.visivel;


    if (
        aparelho.visivel
    ) {

        aparelho.marcador.addTo(
            mapa
        );

    } else {

        mapa.removeLayer(
            aparelho.marcador
        );

    }


    renderizarListaAparelhos();

}
/* ======================================================
   HISTÓRICO DE PERCURSOS
====================================================== */

function atualizarSelectHistorico() {

    const select =
        document.getElementById(
            "historicoAparelho"
        );

    if (!select) {
        return;
    }

    const valorAtual =
        select.value;

    select.innerHTML = "";

    const opcaoInicial =
        document.createElement("option");

    opcaoInicial.value = "";

    opcaoInicial.textContent =
        "Selecione um aparelho";

    select.appendChild(
        opcaoInicial
    );

    Object.keys(aparelhosMapa)
        .forEach(
            function(id) {

                const aparelho =
                    aparelhosMapa[id];

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    id;

                option.textContent =
                    aparelho.nome;

                select.appendChild(
                    option
                );
            }
        );

    if (
        valorAtual &&
        aparelhosMapa[valorAtual]
    ) {

        select.value =
            valorAtual;
    }
}


/* ======================================================
   VER PERCURSO
====================================================== */

async function verHistorico() {

    const aparelhoId =
        document.getElementById(
            "historicoAparelho"
        ).value;

    const data =
        document.getElementById(
            "historicoData"
        ).value;

    const info =
        document.getElementById(
            "historicoInfo"
        );

    if (!aparelhoId) {

        alert(
            "Selecione um aparelho."
        );

        return;
    }

    if (!data) {

        alert(
            "Selecione uma data."
        );

        return;
    }

    info.textContent =
        "Carregando percurso...";

    try {

        const resposta =
            await fetch(
                `/historico/${encodeURIComponent(aparelhoId)}/${data}`
            );

        const dados =
            await resposta.json();

        if (
            !resposta.ok ||
            !dados.sucesso
        ) {

            throw new Error(
                dados.erro ||
                "Erro ao carregar histórico."
            );
        }

        if (
            !Array.isArray(
                dados.pontos
            ) ||
            dados.pontos.length === 0
        ) {

            limparHistorico();

            info.innerHTML =
                "<strong>Nenhum ponto GPS encontrado para esta data.</strong>";

            return;
        }

        desenharHistorico(
            dados.pontos
        );

        const aparelho =
            aparelhosMapa[aparelhoId];

        const nome =
            aparelho
                ? aparelho.nome
                : aparelhoId;

        info.innerHTML =
            "<strong>Aparelho:</strong> " +
            nome +
            "<br>" +

            "<strong>Data:</strong> " +
            data +
            "<br>" +

            "<strong>Pontos GPS:</strong> " +
            dados.pontos.length;

    } catch (erro) {

        console.error(
            "ERRO HISTÓRICO:",
            erro
        );

        info.textContent =
            erro.message;
    }
}


/* ======================================================
   DESENHAR HISTÓRICO
====================================================== */

function desenharHistorico(
    pontos
) {

    // Remove percurso histórico anterior
    if (historicoLayer) {

        mapa.removeLayer(
            historicoLayer
        );

        historicoLayer =
            null;
    }

    const coordenadas =
        pontos
            .map(
                function(ponto) {

                    return [
                        Number(
                            ponto.latitude
                        ),

                        Number(
                            ponto.longitude
                        )
                    ];

                }
            )
            .filter(
                function(posicao) {

                    return (
                        Number.isFinite(
                            posicao[0]
                        ) &&
                        Number.isFinite(
                            posicao[1]
                        )
                    );

                }
            );

    if (
        coordenadas.length === 0
    ) {

        return;
    }

    /*
     * IMPORTANTE:
     *
     * Cada coordenada representa uma
     * posição GPS recebida do celular.
     *
     * A linha segue:
     *
     * GPS 1 → GPS 2 → GPS 3 → GPS 4...
     */

    historicoLayer =
        L.layerGroup();

    // Linha completa do percurso
    const linha =
        L.polyline(
            coordenadas,
            {
                weight: 5
            }
        );

    linha.addTo(
        historicoLayer
    );


    // ==================================================
    // MARCADOR DE INÍCIO
    // ==================================================

    const inicio =
        L.marker(
            coordenadas[0]
        )
        .bindPopup(
            "<strong>INÍCIO DO PERCURSO</strong>"
        );

    inicio.addTo(
        historicoLayer
    );


    // ==================================================
    // MARCADOR DE FIM
    // ==================================================

    const fim =
        L.marker(
            coordenadas[
                coordenadas.length - 1
            ]
        )
        .bindPopup(
            "<strong>FIM DO PERCURSO</strong>"
        );

    fim.addTo(
        historicoLayer
    );


    historicoLayer.addTo(
        mapa
    );


    // Enquadra todo o percurso
    if (
        coordenadas.length > 1
    ) {

        mapa.fitBounds(
            linha.getBounds(),
            {
                padding: [
                    50,
                    50
                ]
            }
        );

    } else {

        mapa.setView(
            coordenadas[0],
            17
        );
    }
}


/* ======================================================
   LIMPAR HISTÓRICO
====================================================== */

function limparHistorico() {

    if (historicoLayer) {

        mapa.removeLayer(
            historicoLayer
        );

        historicoLayer =
            null;
    }

    const info =
        document.getElementById(
            "historicoInfo"
        );

    if (info) {

    }
}


/* ======================================================
   CALCULAR ROTA
====================================================== */

async function calcularRota() {

    if (
        latitudeAtual === null ||
        longitudeAtual === null
    ) {

        alert(
            "Aguardando localização GPS."
        );

        return;
    }


    const texto =
        document.getElementById(
            "enderecos"
        ).value;


    const enderecos =
        texto
            .split(/\r?\n/)
            .map(
                function(e) {
                    return e.trim();
                }
            )
            .filter(
                function(e) {
                    return e.length > 0;
                }
            );


    if (
        enderecos.length === 0
    ) {

        alert(
            "Digite pelo menos um endereço."
        );

        return;
    }


    document.getElementById(
        "status"
    ).textContent =
        "Geocodificando endereços...";


    document.getElementById(
        "info"
    ).innerHTML =
        "Aguarde...";


    try {

        const resposta =
            await fetch(
                "/rota",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            latitude:
                                latitudeAtual,

                            longitude:
                                longitudeAtual,

                            enderecos:
                                enderecos

                        })

                }
            );


        const dados =
            await resposta.json();


        if (
            !resposta.ok ||
            !dados.sucesso
        ) {

            throw new Error(
                dados.erro ||
                "Erro ao calcular rota."
            );
        }


        rotaAtual =
            dados;


        /* ------------------------------------------------
           LINKS GOOGLE MAPS
        ------------------------------------------------ */

        gerarLinksGoogleMaps();
        criarLinkRotaMotorista();


        /* ------------------------------------------------
           MOSTRAR BOTÕES
        ------------------------------------------------ */

        document.getElementById(
            "botaoEnviarRota"
        ).style.display =
            "block";


        document.getElementById(
            "botaoExportarRelatorio"
        ).style.display =
            "block";


        /* ------------------------------------------------
           REMOVER ROTA ANTERIOR
        ------------------------------------------------ */

        if (
            rotaLayer
        ) {

            mapa.removeLayer(
                rotaLayer
            );
        }


        marcadores.forEach(
            function(marcador) {

                mapa.removeLayer(
                    marcador
                );

            }
        );


        marcadores = [];


        /* ------------------------------------------------
           DESENHAR ROTA
        ------------------------------------------------ */

        rotaLayer =
            L.geoJSON(
                dados.rota,
                {

                    style: {

                        weight: 6

                    }

                }
            )
            .addTo(mapa);


        /* ------------------------------------------------
           DESTINOS
        ------------------------------------------------ */

        if (
            Array.isArray(
                dados.destinos
            )
        ) {

            dados.destinos.forEach(
                function(
                    destino,
                    indice
                ) {

                    const numeroEntrega =
                        indice === 0
                            ? "INÍCIO"
                            : indice;


                    const icone =
                        L.divIcon({

                            className:
                                "numero-entrega",

                            html: `

                                <div style="
                                    width:32px;
                                    height:32px;
                                    background:#1976d2;
                                    color:white;
                                    border:3px solid white;
                                    border-radius:50%;
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    font-weight:bold;
                                    font-size:14px;
                                    box-shadow:0 2px 6px rgba(0,0,0,.5);
                                ">

                                    ${numeroEntrega}

                                </div>

                            `,

                            iconSize:
                                [38,38],

                            iconAnchor:
                                [19,19]

                        });


                    const marcador =
                        L.marker(
                            [
                                destino.latitude,
                                destino.longitude
                            ],
                            {
                                icon:
                                    icone
                            }
                        )
                        .addTo(mapa);


                    marcador.bindPopup(

                        "<strong>" +
                        numeroEntrega +
                        "</strong><br><br>" +

                        (
                            destino.endereco ||
                            "Endereço"
                        )

                    );


                    marcadores.push(
                        marcador
                    );

                }
            );

        }


        /* ------------------------------------------------
           ENQUADRAR ROTA
        ------------------------------------------------ */

        if (
            rotaLayer &&
            rotaLayer.getBounds().isValid()
        ) {

            mapa.fitBounds(
                rotaLayer.getBounds(),
                {
                    padding:
                        [40,40]
                }
            );

        }


        /* ------------------------------------------------
           INFORMAÇÕES
        ------------------------------------------------ */

        const km =
            Number(
                dados.distanciaKm || 0
            ).toFixed(2);


        const horas =
            Number(
                dados.duracaoHoras || 0
            );


        document.getElementById(
            "status"
        ).textContent =
            "ROTA CALCULADA";


        document.getElementById(
            "info"
        ).innerHTML =

            "<strong>Paradas:</strong> " +
            (
                dados.quantidade ||
                enderecos.length
            ) +

            "<br>" +

            "<strong>Distância:</strong> " +
            km +
            " km" +

            "<br>" +

            "<strong>Duração:</strong> " +
            horas.toFixed(2) +
            " horas";


    } catch (erro) {

        console.error(
            erro
        );


        document.getElementById(
            "status"
        ).textContent =
            "ERRO";


        document.getElementById(
            "info"
        ).textContent =
            erro.message;

    }

}


/* ======================================================
   GERAR LINKS GOOGLE MAPS
====================================================== */

function gerarLinksGoogleMaps() {

    if (
        !rotaAtual ||
        !rotaAtual.origem ||
        !Array.isArray(
            rotaAtual.destinos
        )
    ) {

        return;
    }


    const origem =
        rotaAtual.origem;


    const destinos =
        rotaAtual.destinos;


    const MAX_DESTINOS_POR_LINK =
        10;


    const links = [];


    let inicio = 0;


    while (
        inicio < destinos.length
    ) {

        const fim =
            Math.min(
                inicio +
                    MAX_DESTINOS_POR_LINK,
                destinos.length
            );


        const pontos = [];


        if (
            inicio === 0
        ) {

            pontos.push(
                origem
            );

        } else {

            pontos.push(
                destinos[
                    inicio - 1
                ]
            );

        }


        for (
            let i = inicio;
            i < fim;
            i++
        ) {

            pontos.push(
                destinos[i]
            );

        }


        const pontoOrigem =
            pontos[0];


        const pontoDestino =
            pontos[
                pontos.length - 1
            ];


        const waypoints =
            pontos.slice(
                1,
                pontos.length - 1
            );


        let url =
            "https://www.google.com/maps/dir/?api=1";


        url +=
            "&origin=" +
            encodeURIComponent(
                pontoOrigem.latitude +
                "," +
                pontoOrigem.longitude
            );


        url +=
            "&destination=" +
            encodeURIComponent(
                pontoDestino.latitude +
                "," +
                pontoDestino.longitude
            );


        if (
            waypoints.length > 0
        ) {

            url +=
                "&waypoints=" +
                encodeURIComponent(

                    waypoints
                        .map(
                            function(p) {

                                return (
                                    p.latitude +
                                    "," +
                                    p.longitude
                                );

                            }
                        )
                        .join("|")

                );

        }


        url +=
            "&travelmode=driving";


        links.push({

            numero:
                links.length + 1,

            inicio:
                inicio + 1,

            fim:
                fim,

            url:
                url

        });


        inicio =
            fim;

    }


    const container =
        document.getElementById(
            "listaLinksRotas"
        );


    container.innerHTML = "";


    links.forEach(
        function(link) {

            const bloco =
                document.createElement(
                    "div"
                );


            bloco.style.marginTop =
                "10px";


            bloco.style.padding =
                "10px";


            bloco.style.border =
                "1px solid #ddd";


            bloco.style.borderRadius =
                "8px";


            const titulo =
                document.createElement(
                    "strong"
                );


            titulo.textContent =
                "ROTA " +
                link.numero +
                " — Entregas " +
                link.inicio +
                " até " +
                link.fim;


            const campo =
                document.createElement(
                    "input"
                );


            campo.type =
                "text";


            campo.value =
                link.url;


            campo.readOnly =
                true;


            campo.style.width =
                "100%";


            campo.style.boxSizing =
                "border-box";


            campo.style.marginTop =
                "6px";


            campo.style.padding =
                "8px";


            const botao =
                document.createElement(
                    "button"
                );


            botao.textContent =
                "COPIAR LINK";


            botao.style.marginTop =
                "6px";


            botao.onclick =
                async function() {

                    try {

                        await navigator
                            .clipboard
                            .writeText(
                                link.url
                            );


                        botao.textContent =
                            "LINK COPIADO ✓";


                        setTimeout(
                            function() {

                                botao.textContent =
                                    "COPIAR LINK";

                            },
                            2000
                        );


                    } catch (erro) {

                        campo.select();

                        document.execCommand(
                            "copy"
                        );


                        botao.textContent =
                            "LINK COPIADO ✓";

                    }

                };


            bloco.appendChild(
                titulo
            );


            bloco.appendChild(
                document.createElement(
                    "br"
                )
            );


            bloco.appendChild(
                campo
            );


            bloco.appendChild(
                botao
            );


            container.appendChild(
                bloco
            );

        }
    );


    document.getElementById(
        "linksRotas"
    ).style.display =
        "block";

}

// ======================================================
// LINK DA ROTA PARA O MOTORISTA
// ======================================================

async function criarLinkRotaMotorista() {

    if (!rotaAtual) {
        alert("Calcule uma rota primeiro.");
        return;
    }

    try {

        const resposta =
            await fetch(
                "/criar-rota-compartilhada",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify(
                            rotaAtual
                        )
                }
            );

        const dados =
            await resposta.json();

        if (
            !resposta.ok ||
            !dados.sucesso
        ) {
            throw new Error(
                dados.erro ||
                "Erro ao criar link."
            );
        }

        const link =
            window.location.origin +
            dados.url;

        document.getElementById(
            "campoLinkMotorista"
        ).value =
            link;

        document.getElementById(
            "painelLinkMotorista"
        ).style.display =
            "block";

    } catch (erro) {

        console.error(erro);
        alert(erro.message);

    }
}


// ======================================================
// COPIAR LINK
// ======================================================

async function copiarLinkMotorista() {

    const campo =
        document.getElementById(
            "campoLinkMotorista"
        );

    if (!campo.value) {
        alert("Nenhum link foi criado.");
        return;
    }

    try {

        await navigator.clipboard.writeText(
            campo.value
        );

    } catch {

        campo.select();
        document.execCommand("copy");

    }

    document.getElementById(
        "botaoCopiarLinkMotorista"
    ).textContent =
        "LINK COPIADO ✓";
}

async function enviarRotaParaCelular() {

    if (!rotaAtual) {

        alert(
            "Calcule uma rota primeiro."
        );

        return;
    }


    const botao =
        document.getElementById(
            "botaoEnviarRota"
        );


    botao.disabled =
        true;


    botao.textContent =
        "ENVIANDO ROTA...";


    try {

        const resposta =
            await fetch(
                "/enviar-rota",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            rotaAtual
                        )

                }
            );


        const resultado =
            await resposta.json();


        if (
            !resposta.ok ||
            !resultado.sucesso
        ) {

            throw new Error(
                resultado.erro ||
                "Não foi possível enviar a rota."
            );

        }


        document.getElementById(
            "status"
        ).textContent =
            "ROTA ENVIADA PARA OS CELULARES";


        document.getElementById(
            "info"
        ).innerHTML +=
            "<br><strong>✓ Rota enviada.</strong>";


        botao.textContent =
            "ROTA ENVIADA ✓";


    } catch (erro) {

        alert(
            erro.message
        );


        botao.textContent =
            "ENVIAR ROTA PARA CELULARES";

    }


    botao.disabled =
        false;

}


/* ======================================================
   EXPORTAR RELATÓRIO
====================================================== */

function exportarRelatorio() {

    if (!rotaAtual) {

        alert(
            "Calcule uma rota primeiro."
        );

        return;
    }


    const origem =
        rotaAtual.origem ||
        {};


    const destinos =
        Array.isArray(
            rotaAtual.destinos
        )
            ? rotaAtual.destinos
            : [];


    let r =
        "RELATÓRIO DE ROTA\n";


    r +=
        "==============================\n\n";


    r +=
        "ORIGEM\n";


    r +=
        "Latitude: " +
        (
            origem.latitude ??
            ""
        ) +
        "\n";


    r +=
        "Longitude: " +
        (
            origem.longitude ??
            ""
        ) +
        "\n\n";


    r +=
        "RESUMO\n";


    r +=
        "Paradas: " +
        (
            rotaAtual.quantidade ??
            destinos.length
        ) +
        "\n";


    r +=
        "Distância: " +
        Number(
            rotaAtual.distanciaKm ||
            0
        ).toFixed(2) +
        " km\n";


    r +=
        "Duração: " +
        Number(
            rotaAtual.duracaoHoras ||
            0
        ).toFixed(2) +
        " horas\n\n";


    r +=
        "SEQUÊNCIA DAS ENTREGAS\n";


    r +=
        "==============================\n\n";


    destinos.forEach(
        function(d, i) {

            r +=
                (
                    i + 1
                ) +
                " - " +
                (
                    d.endereco ||
                    "Endereço não informado"
                ) +
                "\n";


            r +=
                "    Latitude: " +
                (
                    d.latitude ??
                    ""
                ) +
                "\n";


            r +=
                "    Longitude: " +
                (
                    d.longitude ??
                    ""
                ) +
                "\n\n";

        }
    );


    const blob =
        new Blob(
            [r],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "relatorio-rota.txt";


    document.body.appendChild(
        a
    );


    a.click();


    a.remove();


    URL.revokeObjectURL(
        url
    );

}
